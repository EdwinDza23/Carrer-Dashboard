<!DOCTYPE html>
<html lang="en" data-portal="recruiter">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidates — Recruiter Portal</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,680;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-25..0&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/portal.css">
</head>

<body class="portal-body">
  <div class="grain" aria-hidden="true"></div>

  <div class="portal-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="dashboard.html" class="sidebar-logo">
        <svg class="logo-mark" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="9" fill="#14161C" />
          <path d="M8 8h6.5a5.5 5.5 0 0 1 0 11H8V8Zm3 3v5h3.2a2.5 2.5 0 0 0 0-5H11Z" fill="url(#lg-rec)" />
          <path d="M8 21h9" stroke="#7C5CFF" stroke-width="2" stroke-linecap="round" />
          <defs>
            <linearGradient id="lg-rec" x1="8" y1="8" x2="20.5" y2="19" gradientUnits="userSpaceOnUse">
              <stop stop-color="#7C5CFF" />
              <stop offset="1" stop-color="#FF6B4A" />
            </linearGradient>
          </defs>
        </svg>
        <div class="logo-text-wrap">
          <div class="logo-product">Pixel ATS</div>
          <div class="logo-portal">Recruiter Portal</div>
        </div>
      </a>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Overview</div>
        <a href="dashboard.html" class="nav-item"><span class="material-symbols-rounded">dashboard</span>Dashboard</a>
        <a href="jobs.html" class="nav-item"><span class="material-symbols-rounded">work</span>Job Openings<span
            class="nav-count">12</span></a>
        <a href="candidates.html" class="nav-item is-active"><span
            class="material-symbols-rounded">groups</span>Candidates<span class="nav-count nav-count--new">48</span></a>
        <div class="nav-section-label">Management</div>
        <a href="interviews.html" class="nav-item"><span class="material-symbols-rounded">event</span>Interviews<span
            class="nav-count nav-count--urgent">6</span></a>
        <a href="reports.html" class="nav-item"><span class="material-symbols-rounded">bar_chart</span>Reports & SLA</a>
        <div class="nav-section-label">System</div>
        <a href="settings.html" class="nav-item"><span class="material-symbols-rounded">settings</span>Settings</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user" id="user-menu-btn">
          <div class="avatar avatar--sm" data-session="avatar">RK</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" data-session="name">Riya Kapoor</div>
            <div class="sidebar-user-role" data-session="title">Lead Recruiter</div>
          </div>
          <span class="material-symbols-rounded" style="color:var(--text-faint)">unfold_more</span>
        </div>
        <div class="user-menu" id="user-menu">
          <a href="settings.html" class="user-menu-item"><span
              class="material-symbols-rounded">settings</span>Settings</a>
          <hr class="user-menu-divider">
          <button class="user-menu-item user-menu-item--danger" id="logout-btn"><span
              class="material-symbols-rounded">logout</span>Sign Out</button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="portal-main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:var(--sp-3)">
          <button class="sidebar-toggle-btn" id="sidebar-toggle"><span
              class="material-symbols-rounded">menu</span></button>
          <div>
            <div class="topbar-eyebrow">TALENT POOL</div>
            <h1 class="topbar-title">Candidates</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="theme-toggle"><span class="material-symbols-rounded">light_mode</span></button>
          <button class="btn btn--primary btn--sm" onclick="ATS.Toast.show('Add Candidate modal opened.', 'info')"><span
              class="material-symbols-rounded">person_add</span> Add Candidate</button>
        </div>
      </header>

      <div class="page-content">
        <div class="page-toolbar">
          <div class="toolbar-left">
            <div class="chip-row">
              <button class="chip is-active" data-cand-filter="all">All Candidates (9)</button>
              <button class="chip" data-cand-filter="shortlisting">Shortlisted (5)</button>
              <button class="chip" data-cand-filter="interviewing">Interviewing (3)</button>
              <button class="chip" data-cand-filter="offer">Offer (1)</button>
            </div>
          </div>
          <div class="toolbar-right">
            <div class="search-wrap">
              <span class="material-symbols-rounded">search</span>
              <input type="search" id="cand-search" placeholder="Search candidate name or skills…">
            </div>
          </div>
        </div>

        <div class="candidate-grid" id="candidate-grid" data-reveal></div>
      </div>
    </div>
  </div>

  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/shared.js"></script>
  <script src="../assets/js/data.js"></script>
  <script>
    (function () {
      'use strict';
      const data = ATS.Data.recruiter;
      const session = ATS.Portal.init({ role: 'recruiter', notifs: data.notifications });
      if (!session) return;

      let currentFilter = 'all';
      let searchQuery = '';

      function render() {
        const grid = document.getElementById('candidate-grid');
        const filtered = data.candidates.filter(c => {
          const matchF = currentFilter === 'all' ? true : c.stage === currentFilter;
          const matchS = c.name.toLowerCase().includes(searchQuery) || c.skills.some(s => s.toLowerCase().includes(searchQuery));
          return matchF && matchS;
        });

        if (!filtered.length) {
          grid.innerHTML = ATS.Utils.emptyState({ icon: 'person_search', title: 'No candidates found' });
          return;
        }

        grid.innerHTML = filtered.map(c => `
      <div class="candidate-card frame">
        <div class="candidate-card-top">
          <div class="avatar avatar--md">${ATS.Utils.initials(c.name)}</div>
          <div style="flex:1">
            <div class="candidate-name">${c.name}</div>
            <div class="candidate-role">${c.jobTitle} · ${c.company}</div>
            <div class="candidate-loc">${c.exp} exp · ${c.location}</div>
          </div>
          <span class="score-badge">${c.score}% match</span>
        </div>

        <div class="skill-tags">
          ${c.skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}
        </div>

        <div class="candidate-actions" style="margin-top:auto">
          <button class="btn btn--accept btn--sm" style="flex:1" onclick="ATS.Toast.show('${c.name} moved to client shortlist!', 'success')">Shortlist to Client</button>
          <button class="btn btn--secondary btn--sm" onclick="ATS.Toast.show('Viewing candidate details for ${c.name}', 'info')"><span class="material-symbols-rounded">visibility</span></button>
        </div>
      </div>
    `).join('');

        ATS.FrameCorners.inject(grid);
      }

      ATS.ChipFilter.init('data-cand-filter', val => { currentFilter = val; render(); });
      document.getElementById('cand-search').addEventListener('input', e => { searchQuery = e.target.value.toLowerCase(); render(); });

      render();
    })();
  </script>
</body>

</html>
