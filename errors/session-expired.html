<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Expired | Edwin ATS</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--sp-5);
    text-align: center;
  }
  .error-card {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: var(--sp-8) var(--sp-7);
    max-width: 480px;
    box-shadow: var(--shadow-deep);
  }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<main class="error-card frame">
  <span class="material-symbols-rounded" style="font-size:3.5rem;color:var(--amber);margin-bottom:var(--sp-4)">timer_off</span>
  <h1 style="font-size:1.5rem;margin-bottom:var(--sp-2)">Session Expired</h1>
  <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:var(--sp-6)">For security purposes, your session has timed out after a period of inactivity. Please sign in again to continue.</p>
  <a href="../auth/login.html" class="btn btn--primary">Sign In Again</a>
</main>

<script src="../assets/js/auth.js"></script>
<script src="../assets/js/shared.js"></script>
<script>
  ATS.FrameCorners.inject();
  ATS.Theme.init();
</script>
</body>
</html>
