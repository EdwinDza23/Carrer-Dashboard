<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 — Server Error | Edwin ATS</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--sp-5);
    text-align: center;
  }
  .error-card {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: var(--sp-8) var(--sp-7);
    max-width: 480px;
    box-shadow: var(--shadow-deep);
  }
  .error-code {
    font-family: var(--font-display);
    font-size: 5rem;
    font-weight: 600;
    line-height: 1;
    color: var(--coral);
    margin-bottom: var(--sp-2);
  }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<main class="error-card frame">
  <div class="error-code">500</div>
  <h1 style="font-size:1.5rem;margin-bottom:var(--sp-2)">Internal Server Error</h1>
  <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:var(--sp-6)">Something went wrong on our system. Please refresh or try again later.</p>
  <button class="btn btn--primary" onclick="location.reload()">Reload Page</button>
</main>

<script src="../assets/js/auth.js"></script>
<script src="../assets/js/shared.js"></script>
<script>
  ATS.FrameCorners.inject();
  ATS.Theme.init();
</script>
</body>
</html>
