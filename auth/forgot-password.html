<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Enterprise ATS</title>
<link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,680;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-25..0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--sp-5);
  }
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: var(--sp-7);
    width: 100%;
    max-width: 440px;
    box-shadow: var(--shadow-deep);
  }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<main class="auth-card frame">
  <a href="login.html" style="display:inline-flex;align-items:center;gap:4px;font-size:.82rem;color:var(--text-muted);margin-bottom:var(--sp-4)">
    <span class="material-symbols-rounded">arrow_back</span> Back to Sign In
  </a>
  
  <p class="eyebrow" style="margin-bottom:var(--sp-2)">ACCOUNT RECOVERY</p>
  <h1 style="font-size:1.6rem;margin-bottom:var(--sp-2)">Reset your password</h1>
  <p style="color:var(--text-muted);font-size:.88rem;margin-bottom:var(--sp-6)">Enter your email address and we will send you a secure link to reset your account password.</p>

  <form id="forgot-form" class="form-section">
    <div class="field">
      <label for="forgot-email">Account Email Address</label>
      <input type="email" id="forgot-email" placeholder="you@company.com" required>
    </div>
    <button type="submit" class="btn btn--primary btn--block">Send Reset Link</button>
  </form>
</main>

<script src="../assets/js/auth.js"></script>
<script src="../assets/js/shared.js"></script>
<script>
  ATS.FrameCorners.inject();
  ATS.Theme.init();

  document.getElementById('forgot-form').addEventListener('submit', (e) => {
    e.preventDefault();
    ATS.Toast.show('Reset link sent! Please check your email inbox.', 'success', 5000);
    setTimeout(() => {
      location.href = 'reset-password.html';
    }, 1200);
  });
</script>
</body>
</html>
